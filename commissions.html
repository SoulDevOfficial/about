<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="Soul's Profile">
    <meta property="og:description" content="Hey! Click to check out my new web profile!">
    <meta property="og:url" content="https://soul.dedyn.io">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#b4c2be">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul // Commissions</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0f1012;
            --card-bg: rgba(24, 25, 28, 0.88);
            
            --accent-main: #b4c2be;   
            --accent-dim: #7a8a86;    
            --accent-light: #e6efec;  
            --accent-warm: #dca368;
            
            --text-gray: #a0a5a4;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .card-wrapper {
            position: relative;
            background: #111214;
            padding: 2px;
            border-radius: 26px;
            width: 100%;
            max-width: 850px;
            border: 1px solid var(--accent-dim);
            box-shadow: 0 0 25px rgba(180, 194, 190, 0.12), 0 30px 60px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            margin-bottom: 30px;
            z-index: 1;
        }

        .card-wrapper.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .container {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 3.2rem 4rem;
            position: relative;
            z-index: 1;
        }

        .page-header {
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--accent-main);
        }

        .nav-link-top {
            color: var(--text-gray);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            border: 1px solid #282b30;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .nav-link-top:hover {
            color: var(--accent-main);
            border-color: var(--accent-main);
            background: rgba(180, 194, 190, 0.05);
        }

        .commission-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .commission-card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .showcase-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111214;
            border-radius: 14px;
            border: 1px solid #282b30;
            overflow: hidden;
            position: relative;
        }

        .showcase-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .commission-card:hover .showcase-img img {
            opacity: 1;
            transform: scale(1.03);
        }

        .animated-btn {
            position: relative;
            background: #111214;
            padding: 1px;
            border-radius: 12px;
            text-decoration: none;
            overflow: hidden;
            display: block;
            width: 100%;
            border: 1px solid #282b30;
            transition: border-color 0.3s;
        }

        .animated-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent-main));
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .animated-btn:hover::before {
            opacity: 1;
        }

        .animated-btn:hover {
            border-color: transparent;
        }

        @keyframes rotate {
            100% { transform: rotate(1turn); }
        }

        .btn-inner {
            background: #18191c;
            padding: 14px 18px;
            border-radius: 11px;
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-main);
        }

        .btn-inner span:last-child {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent-dim);
        }

        .footer-copyright {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-gray);
            opacity: 0.4;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            pointer-events: none;
            padding-bottom: 20px;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2.5rem 2rem;
            }
            .card-wrapper {
                margin: 20px;
                max-width: calc(100% - 40px);
            }
            .commission-grid {
                grid-template-columns: 1fr;
            }
            .page-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="card-wrapper" id="mainContainer">
        <div class="container">
            <div class="page-header">
                <h1 id="soulTitle">Available Commissions</h1>
                <a href="index" class="nav-link-top">← Back to Profile</a>
            </div>

            <div class="commission-grid">
                <div class="commission-card">
                    <div class="showcase-img">
                        <img src="preview1.png" alt="Cool pic #1">
                    </div>
                    <a href="cnote" class="animated-btn">
                        <div class="btn-inner">
                            <span>Custom Bot</span>
                            <span>-></span>
                        </div>
                    </a>
                </div>

                <div class="commission-card">
                    <div class="showcase-img">
                        <img src="preview2.png" alt="Cool pic #2">
                    </div>
                    <a href="cnote" class="animated-btn">
                        <div class="btn-inner">
                            <span>Custom Website</span>
                            <span>-></span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-copyright">
        &copy; 2026 Soul. All Rights Reserved.
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('mainContainer');
            setTimeout(() => {
                container.classList.add('loaded');
            }, 100);

            const soulTitle = document.getElementById('soulTitle');
            let brightness = 1;
            setInterval(() => {
                brightness = brightness === 1 ? 0.8 : 1;
                soulTitle.style.transition = 'opacity 2s ease-in-out';
                soulTitle.style.opacity = brightness;
            }, 2000);

            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const particleCount = 45;
            const particles = [];
            
            const colors = [
                'rgba(180, 194, 190, ',
                'rgba(220, 163, 104, ',
                'rgba(255, 255, 255, '
            ];

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + Math.random() * 100;
                    this.radius = Math.random() * 2 + 0.5;
                    this.colorPrefix = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = Math.random() * 0.5 + 0.1;
                    this.speedY = Math.random() * 0.4 + 0.1;
                    this.speedX = (Math.random() - 0.5) * 0.2;
                    this.fadeSpeed = Math.random() * 0.003 + 0.001;
                }

                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX;

                    if (this.y < canvas.height * 0.8) {
                        this.alpha -= this.fadeSpeed;
                    }

                    if (this.y < 0 || this.alpha <= 0) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.colorPrefix + this.alpha + ')';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.colorPrefix + '0.5)';
                    ctx.fill();
                    ctx.shadowBlur = 0; 
                }
            }

            for (let i = 0; i < particleCount; i++) {
                const p = new Particle();
                p.y = Math.random() * canvas.height;
                particles.push(p);
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
